<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA — Music Player</title>
    <meta name="description" content="Premium glassmorphic music player with CoverFlow navigation">
    <script src="/node_modules/jsmediatags/dist/jsmediatags.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<canvas id="particle-canvas"></canvas>

<div class="player-container" id="player-container">

    <!-- ── Upload Screen ── -->
    <div class="upload-view" id="upload-view">
        <div class="upload-logo">AURA Player</div>
        <div class="upload-icon-wrap">
            <svg viewBox="0 0 24 24" width="36" height="36" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 18V5l12-2v13"/>
                <circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
            </svg>
        </div>
        <h2>Your Music. Elevated.</h2>
        <p>Load your MP3 folder and experience it like never before</p>
        <input type="file" id="music-input" webkitdirectory directory multiple accept="audio/mpeg,audio/mp3">
        <label for="music-input" class="upload-btn" id="upload-btn-label">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Choose Folder
        </label>
        <span class="upload-hint">Supports nested folders · Auto-reads album art</span>
    </div>

    <!-- ── Player Screen ── -->
    <div class="player-view hidden" id="player-view">
        <div id="album-backdrop"></div>

        <!-- Left Panel -->
        <div class="left-panel">

            <!-- Top Bar -->
            <div class="top-bar">
                <span class="app-brand">AURA</span>
                <div class="status-pill">
                    <div class="status-dot" id="status-dot"></div>
                    <span id="status-text">Ready</span>
                </div>
            </div>

            <!-- CoverFlow -->
            <div class="coverflow-container" id="coverflow"></div>

            <!-- Controls -->
            <div class="controls-area">
                <div class="track-info">
                    <div class="track-title" id="track-title">Select a Track</div>
                    <div class="track-artist" id="track-artist">—</div>
                </div>

                <!-- Progress -->
                <div class="progress-row">
                    <span class="time-label" id="time-elapsed">0:00</span>
                    <div class="progress-bar-bg" id="progress-bg">
                        <div class="progress-bar-fill" id="progress-fill"></div>
                    </div>
                    <span class="time-label" id="time-total">0:00</span>
                </div>

                <!-- Playback -->
                <div class="playback-controls">
                    <button class="control-btn" id="btn-shuffle" title="Shuffle">
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/>
                        </svg>
                    </button>
                    <button class="control-btn" id="btn-prev" title="Previous">
                        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/>
                        </svg>
                    </button>
                    <button class="control-btn play-btn" id="btn-play" title="Play / Pause">
                        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="currentColor" stroke-linecap="round" stroke-linejoin="round" id="icon-play"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="currentColor" stroke-linecap="round" stroke-linejoin="round" id="icon-pause" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                    </button>
                    <button class="control-btn" id="btn-next" title="Next">
                        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/>
                        </svg>
                    </button>
                    <button class="control-btn" id="btn-repeat" title="Repeat">
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Waveform visualizer -->
            <canvas id="visualizer-canvas"></canvas>
        </div>

        <!-- Right Panel — Queue -->
        <div class="right-panel">
            <div class="queue-header">
                <span class="queue-title">Up Next</span>
                <span class="queue-count" id="queue-count">0 tracks</span>
            </div>
            <div class="queue-list" id="queue-list"></div>
            <div class="volume-row">
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                </svg>
                <input type="range" id="volume-slider" min="0" max="100" value="80">
                <span class="vol-pct" id="vol-pct">80%</span>
            </div>
        </div>

    </div><!-- /player-view -->
</div><!-- /player-container -->

<audio id="audio-player"></audio>
<script src="startup.js"></script>
<script src="app.js"></script>
</body>
</html>
